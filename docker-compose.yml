services:
  api:
    build:
      context: ./app/api
    image: frp-api
    container_name: frp-api
    ports:
      - "8000:8000"
    volumes:
      - ./app/api:/app
      - api-venv:/app/.venv
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: ./docker/web/Dockerfile
    image: frp-web
    container_name: frp-web
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/app/web/node_modules
      - web-svelte-kit:/workspace/app/web/.svelte-kit
    environment:
      - PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adapter:
    build:
      context: ./app/adapter
    image: frp-adapter
    container_name: frp-adapter
    ports:
      - "8001:8001"
    volumes:
      - ./app/adapter:/app
      - adapter-gocache:/root/.cache/go-build
    environment:
      - CGO_ENABLED=0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  api-venv:
  web-node-modules:
  web-svelte-kit:
  adapter-gocache:
